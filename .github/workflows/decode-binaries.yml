name: Decode staged binaries

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decode-binaries
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode _agent_binary_staging/*.b64 into repo paths
        run: |
          set -euo pipefail
          if [ ! -d _agent_binary_staging ]; then
            echo "No staging dir; nothing to do"
            exit 0
          fi
          count=0
          while IFS= read -r -d '' f; do
            rel="${f#_agent_binary_staging/}"
            rel="${rel%.b64}"
            mkdir -p "$(dirname "$rel")"
            base64 -d < "$f" > "$rel"
            git add -f "$rel"
            count=$((count+1))
            echo "decoded $rel ($(wc -c < "$rel") bytes)"
          done < <(find _agent_binary_staging -type f -name '*.b64' -print0 | sort -z)
          git rm -rf _agent_binary_staging
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(ss2): sync binary assets (${count} files from staging)"
          git push origin HEAD:main
